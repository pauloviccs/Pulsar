<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulsar - Redefinição de Senha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background-color: #070A14;
      color: #F0F0F5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }
    .ambient-glow-1 {
      position: fixed;
      top: -15%;
      left: -10%;
      width: 60vw;
      height: 60vw;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(239, 125, 75, 0.25) 0%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    .ambient-glow-2 {
      position: fixed;
      bottom: -20%;
      right: -10%;
      width: 65vw;
      height: 65vw;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(48, 147, 170, 0.22) 0%, transparent 70%);
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
    }
    .card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      background: rgba(18, 24, 38, 0.88);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 28px;
      padding: 36px 32px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.08);
      animation: floatIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes floatIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .header {
      text-align: center;
      margin-bottom: 28px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 54px;
      height: 54px;
      background: #1E1E1C;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 18px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .badge svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: #EF7D4B;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #FFFFFF;
      margin-bottom: 8px;
    }
    p.subtitle {
      font-size: 13px;
      color: rgba(240, 240, 245, 0.6);
      line-height: 1.5;
    }
    .form-group {
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.75);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      color: #FFFFFF;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }
    input:focus {
      background: rgba(255, 255, 255, 0.09);
      border-color: #EF7D4B;
      box-shadow: 0 0 0 3px rgba(239, 125, 75, 0.2);
    }
    .btn {
      width: 100%;
      padding: 14px 20px;
      background: #EF7D4B;
      color: #FFFFFF;
      border: none;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(239, 125, 75, 0.35);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      margin-top: 10px;
    }
    .btn:hover {
      background: #e86f3b;
      transform: translateY(-1px);
      box-shadow: 0 10px 28px rgba(239, 125, 75, 0.45);
    }
    .btn:active {
      transform: translateY(0);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .alert {
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 12px;
      line-height: 1.5;
      margin-bottom: 18px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      animation: fadeIn 0.2s ease;
    }
    .alert-error {
      background: rgba(239, 125, 75, 0.15);
      border: 1px solid rgba(239, 125, 75, 0.35);
      color: #FF8F6B;
    }
    .alert-success {
      background: rgba(48, 147, 170, 0.2);
      border: 1px solid rgba(48, 147, 170, 0.4);
      color: #6AD1E8;
    }
    .alert-info {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(240, 240, 245, 0.85);
    }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .open-app-btn {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .open-app-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }
  </style>
</head>
<body>
  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>

  <div class="card">
    <div class="header">
      <div class="badge">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </div>
      <h1>Pulsar Account</h1>
      <p class="subtitle" id="subtitle-text">Defina sua nova senha para recuperar o acesso à sua conta.</p>
    </div>

    <div id="status-container"></div>

    <form id="reset-form" style="display: none;">
      <div class="form-group">
        <label for="new-password">Nova Senha</label>
        <input 
          type="password" 
          id="new-password" 
          placeholder="Mínimo de 6 caracteres" 
          required 
          minlength="6"
          autocomplete="new-password"
        />
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirmar Nova Senha</label>
        <input 
          type="password" 
          id="confirm-password" 
          placeholder="Repita a nova senha" 
          required 
          minlength="6"
          autocomplete="new-password"
        />
      </div>

      <button type="submit" class="btn" id="submit-btn">
        <span>Salvar Nova Senha</span>
      </button>
    </form>

    <div id="success-view" style="display: none; text-align: center; padding-top: 10px;">
      <div class="alert alert-success" style="text-align: left;">
        <div>
          <strong>Sucesso!</strong> Sua nova senha foi salva e sincronizada com o banco de dados.
        </div>
      </div>
      <p style="font-size: 13px; color: rgba(240, 240, 245, 0.7); line-height: 1.6; margin-bottom: 8px;">
        Você já pode abrir o aplicativo <strong>Pulsar</strong> e fazer login com suas novas credenciais.
      </p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "__SUPABASE_URL__";
    const SUPABASE_ANON_KEY = "__SUPABASE_ANON_KEY__";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const statusContainer = document.getElementById('status-container');
    const resetForm = document.getElementById('reset-form');
    const successView = document.getElementById('success-view');
    const submitBtn = document.getElementById('submit-btn');
    const newPasswordInput = document.getElementById('new-password');
    const confirmPasswordInput = document.getElementById('confirm-password');

    function showStatus(message, type = 'info') {
      statusContainer.innerHTML = `<div class="alert alert-${type}"><div>${message}</div></div>`;
    }

    async function init() {
      showStatus('<div class="spinner"></div> Autenticando link de recuperação...', 'info');

      // 1. Verificar hash fragment (#access_token=...&refresh_token=...)
      const hash = window.location.hash.substring(1);
      const hashParams = new URLSearchParams(hash);
      const accessToken = hashParams.get('access_token');
      const refreshToken = hashParams.get('refresh_token');

      // 2. Verificar query params (?token_hash=... ou ?code=...)
      const urlParams = new URLSearchParams(window.location.search);
      const tokenHash = urlParams.get('token_hash');
      const code = urlParams.get('code');

      try {
        if (accessToken && refreshToken) {
          const { data, error } = await supabase.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken
          });
          if (error) throw error;
        } else if (tokenHash) {
          const { data, error } = await supabase.auth.verifyOtp({
            token_hash: tokenHash,
            type: 'recovery'
          });
          if (error) throw error;
        } else if (code) {
          const { data, error } = await supabase.auth.exchangeCodeForSession(code);
          if (error) throw error;
        } else {
          const { data: { session } } = await supabase.auth.getSession();
          if (!session) {
            throw new Error('Link de recuperação expirado ou inválido. Abra o aplicativo Pulsar e solicite uma nova redefinição.');
          }
        }

        statusContainer.innerHTML = '';
        resetForm.style.display = 'block';
      } catch (err) {
        showStatus(err.message || 'Falha ao autenticar o link de recuperação.', 'error');
      }
    }

    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const pass = newPasswordInput.value;
      const conf = confirmPasswordInput.value;

      if (!pass || pass.length < 6) {
        showStatus('A senha deve conter no mínimo 6 caracteres.', 'error');
        return;
      }
      if (pass !== conf) {
        showStatus('As senhas não coincidem. Digite a mesma senha em ambos os campos.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<div class="spinner"></div><span>Salvando...</span>';
      statusContainer.innerHTML = '';

      try {
        const { error } = await supabase.auth.updateUser({
          password: pass
        });

        if (error) throw error;

        resetForm.style.display = 'none';
        successView.style.display = 'block';
        document.getElementById('subtitle-text').textContent = 'Sua senha foi redefinida com sucesso.';
      } catch (err) {
        showStatus(err.message || 'Erro ao atualizar a senha no banco de dados.', 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Salvar Nova Senha</span>';
      }
    });

    init();
  </script>
</body>
</html>
